<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらめきクイズ</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header><a href="/">✦ ひらめきクイズ</a><span>小さな挑戦、大きな発見。</span></header>
<main>
<div class="eyebrow">DAILY BRAIN BREAK</div>
<h1>ひらめく準備は、できた？</h1>
<p class="intro">ちょっとした空き時間に、知識の腕試し。<br>最大5問のクイズで、頭を軽くウォーミングアップ。</p>
<section class="card" id="content" aria-live="polite" aria-busy="false">
<div id="setup">
<span class="tag">4択クイズ · 一般知識</span>
<h2>今日のチャレンジ</h2>
<p>挑戦する問題数を選んでスタートしましょう。</p>
<label for="count">問題数</label>
<select id="count"><option value="1">1問</option><option value="2">2問</option><option value="3">3問</option><option value="4">4問</option><option value="5" selected>5問</option></select>
<button id="start" class="primary">クイズをはじめる →</button>
<div class="hint">時間制限なし。自分のペースで楽しもう。</div>
</div>
<div id="quiz" hidden></div>
<div id="result" hidden></div>
<p id="error" role="alert" hidden></p>
</section>
<footer>ひとつの「なるほど」が、今日をちょっと面白くする。</footer>
</main>
</body></html>
