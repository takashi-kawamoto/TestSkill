<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>クイズ管理 · ひらめきクイズ</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/admin.js" defer></script>
</head>
<body>
<header><a href="/">✦ ひらめきクイズ</a><a href="/">クイズに戻る</a></header>
<main>
<div class="eyebrow">QUIZ MANAGEMENT</div><h1>クイズ管理</h1>
<p class="intro">問題の追加・編集・削除ができます。登録は最大5問。<br>管理機能は同じPCからのみ利用できます。</p>
<p id="message" role="status" aria-live="polite"></p>
<section class="card">
<h2>登録済みの問題 <small id="total"></small></h2>
<div id="list" aria-busy="true"></div>
<button id="add" class="primary" disabled>問題を追加</button>
<button id="reload" type="button">一覧を再読み込み</button>
</section>
<section class="card editor" id="editor" hidden>
<h2 id="editor-title">問題を追加</h2>
<form id="form">
<label for="text">問題文</label><textarea id="text" required maxlength="1000"></textarea>
<label for="choice-0">選択肢 A</label><input id="choice-0" required maxlength="500">
<label for="choice-1">選択肢 B</label><input id="choice-1" required maxlength="500">
<label for="choice-2">選択肢 C</label><input id="choice-2" required maxlength="500">
<label for="choice-3">選択肢 D</label><input id="choice-3" required maxlength="500">
<label for="correct">正解</label><select id="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
<label for="explanation">解説</label><textarea id="explanation" required maxlength="4000"></textarea>
<button id="save" class="primary" type="submit">保存する</button>
<button id="cancel" type="button">キャンセル</button>
</form>
</section>
</main>
</body></html>
